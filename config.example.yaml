# Configuración del buscador de chollos.
# Copia este fichero a config.yaml (o ejecuta `python -m chollos init`).

currency: EUR
user_country_code: es
user_locale: es

storage:
  db_path: data/chollos.db
  snapshots_dir: snapshots

# Búsquedas que se vigilan en cada escaneo.
# Cada una es un destino/fechas/ocupación. Da igual el destino: el objetivo es
# comparar precios y cazar errores.
watchlist:
  - name: "Barcelona verano"
    destination: "Barcelona, Spain"
    city_code: "BCN"   # código IATA de ciudad (lo usa Amadeus). Si falta, se intenta resolver desde destination.
    checkin: "2026-09-05"
    checkout: "2026-09-07"
    adults: 2
  - name: "Madrid septiembre"
    destination: "Madrid, Spain"
    city_code: "MAD"
    checkin: "2026-09-12"
    checkout: "2026-09-14"
    adults: 2
  - name: "París septiembre"
    destination: "Paris, France"
    city_code: "PAR"
    checkin: "2026-09-19"
    checkout: "2026-09-21"
    adults: 2
  - name: "Roma octubre"
    destination: "Rome, Italy"
    city_code: "ROM"
    checkin: "2026-10-10"
    checkout: "2026-10-12"
    adults: 2

# Reglas de detección de chollos.
detection:
  # Caída respecto al PROPIO precio normal del hotel (estrategia histórica).
  # 0.5 = avisa si está al menos un 50% por debajo de su mediana histórica.
  historical_drop_pct: 0.5

  # Precio como fracción de la mediana de hoteles COMPARABLES de la misma
  # categoría en esa búsqueda (estrategia comparativa, funciona sin historial).
  # 0.5 = avisa si cuesta la mitad o menos que sus semejantes.
  peer_discount_pct: 0.5

  # Nº mínimo de observaciones para fiarse del baseline histórico.
  min_history_points: 3
  # Nº mínimo de hoteles comparables para la estrategia comparativa.
  min_peers: 4

  # Techo absoluto opcional (€/noche): cualquier precio por debajo avisa siempre.
  # Déjalo en null para desactivarlo.
  absolute_max_price_per_night: null

  # Ignora precios por debajo de esto (probable dato corrupto, no chollo real).
  floor_price_per_night: 1.0

# Fuentes de datos con API. Amadeus da hoteles (y vuelos en el futuro).
# Alta gratis en https://developers.amadeus.com → crea una app y copia
# API Key y API Secret en variables de entorno (nunca aquí):
#   export AMADEUS_API_KEY="..."
#   export AMADEUS_API_SECRET="..."
# Uso: python -m chollos scan --provider amadeus
sources:
  amadeus:
    api_key_env: AMADEUS_API_KEY
    api_secret_env: AMADEUS_API_SECRET
    hostname: test        # "test" (gratis, datos limitados) | "production"
    max_hotels: 40        # nº de hoteles por ciudad a consultar en cada escaneo

# Avisos por email (opcional). Para Gmail usa una "contraseña de aplicación"
# y guárdala en la variable de entorno indicada en password_env.
notifications:
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    username: "tucorreo@gmail.com"
    sender: "tucorreo@gmail.com"
    password_env: CHOLLOS_EMAIL_PASSWORD
    to:
      - "tucorreo@gmail.com"
